apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "prigossip.fullname" . }}-agent
  labels:
    {{- include "prigossip.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "prigossip.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "prigossip.selectorLabels" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "prigossip.serviceAccountName" . }}
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -listen=:{{ .Values.agent.listenPort }}
            - -admin=:{{ .Values.agent.adminPort }}
            - -mqtt={{ include "prigossip.brokerUrl" . }}
            - -service={{ .Values.service.name }}
            - -backend-port={{ .Values.service.backendPort }}
            - -selector={{ .Values.service.selector }}
            - -namespace=$(POD_NAMESPACE)
            - -policy=/etc/prigossip/policy.json
            {{- if .Values.ebpf.enabled }}
            - -bpf-dir={{ .Values.ebpf.objDir }}
            - -cgroup={{ .Values.ebpf.cgroupRoot }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: GOSSIP_PEERS
              value: {{ .Values.agent.extraPeers | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.agent.listenPort }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.agent.adminPort }}
              protocol: TCP
            - name: gossip
              containerPort: {{ .Values.agent.gossipPort }}
              protocol: UDP
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add:
                - BPF
                - SYS_ADMIN
                - NET_ADMIN
                - PERFMON
          volumeMounts:
            - name: policy
              mountPath: /etc/prigossip
              readOnly: true
            {{- if .Values.ebpf.enabled }}
            - name: bpf-objects
              mountPath: {{ .Values.ebpf.objDir }}
              readOnly: true
            - name: cgroup
              mountPath: {{ .Values.ebpf.cgroupRoot }}
              readOnly: true
            - name: bpffs
              mountPath: /sys/fs/bpf
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: {{ include "prigossip.fullname" . }}-policy
        {{- if .Values.ebpf.enabled }}
        - name: bpf-objects
          hostPath:
            path: {{ .Values.ebpf.hostPath }}
            type: DirectoryOrCreate
        - name: cgroup
          hostPath:
            path: {{ .Values.ebpf.cgroupRoot }}
            type: Directory
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
